
name: Deploy Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t kunalmadoliya/learn-deploy:latest \
            -f nodejs-deploy/Dockerfile \
            nodejs-deploy

      - name: Push Docker Image
        run: |
          docker push kunalmadoliya/learn-deploy:latest

      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.AZURE_VM_SSH_PASSPHRASE }}
          script: |
            docker stop learn-deploy || true
            docker rm learn-deploy || true
            docker pull kunalmadoliya/learn-deploy:latest
            docker run -d --name learn-deploy -p 8000:3000 kunalmadoliya/learn-deploy:latest