name: Deploy Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t kunalmadoliya/learn-deploy:tagname .
          docker push kunalmadoliya/learn-deploy:tagname

      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.AZURE_VM_SSH_PASSPHRASE }}
          script: |
            export PATH="/home/azureuser/.nvm/versions/node/v24.21.0/bin:$PATH"
            cd /home/azureuser/learn-react/nodejs-deploy
            git pull origin main
            npm install
            if pm2 describe nodejs-deploy >/dev/null 2>&1; then
              pm2 restart nodejs-deploy
            else
              pm2 start index.js --name nodejs-deploy
            fi
            pm2 save
