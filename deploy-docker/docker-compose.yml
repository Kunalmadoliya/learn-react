services:
  frontend:
    build : ./frontend
    ports : 
     - "5173:80"
    depends_on:
      - backend
      - database
    networks:
      - my-custom-network
  backend:
    build : ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: mydatabase
    depends_on:
      - database
    networks:
      - my-custom-network
  database:
    image : postgres:16-alpine
    restart : always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - my-custom-network

volumes:
  pgdata:
networks:
  my-custom-network:
    driver: bridge
